[project]
name = "cmsac-bayes-2026"
version = "0.1.0"
description = "Was It the Player or the Team? A Bayesian skill model for soccer, in PyMC (CMSAC 2026 workshop)"
readme = "README.md"
authors = [{ name = "Alexandre Andorra" }]
requires-python = ">=3.12"
dependencies = [
    "arviz==1.3.0",
    "arviz-base==1.3.1",
    "arviz-plots==1.3.2",
    "arviz-stats==1.3.3",
    "matplotlib>=3.10",
    "numpy>=2.2",
    "nutpie==0.16.11",
    "pandas>=2.2",
    "preliz==0.28.0",
    "pymc==6.3.2",
    "pytensor==3.3.4",
    "scikit-learn>=1.6",
    "scipy>=1.14",
    "statsmodels>=0.14",
    "xarray>=2025.1",
]

[dependency-groups]
dev = [
    "graphviz>=0.21",
    "ipykernel>=7.0",
    "ipywidgets>=8.1",
    "jupyterlab>=4.4",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "pytest>=8.4",
    "ruff>=0.14",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
